stages:
  - test
  - sonarqube-scan

# ─────────────────────────────────────────────────────────────
# Stage 1: Unit Tests + Code Coverage (PHPUnit)
# ─────────────────────────────────────────────────────────────
phpunit-tests:
  stage: test
  image: php:8.2-cli
  
  before_script:
    # ติดตั้ง Xdebug สำหรับ Code Coverage
    - pecl install xdebug
    - docker-php-ext-enable xdebug
    - echo "xdebug.mode=coverage" >> /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    
    # ติดตั้ง Composer
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    
    # ติดตั้ง Dependencies
    - composer install --no-interaction --prefer-dist --no-progress
    
  script:
    # รัน PHPUnit พร้อม Coverage Report (Clover format สำหรับ SonarQube)
    - php vendor/phpunit/phpunit/phpunit
        --configuration phpunit.xml
        --coverage-clover coverage.xml
        --log-junit report.xml
        --colors=never
  
  artifacts:
    when: always
    paths:
      - coverage.xml    # สำหรับ SonarQube Coverage Import
      - report.xml      # JUnit XML สำหรับ GitLab Test Report
    reports:
      junit: report.xml  # แสดงผลใน GitLab MR Test Summary
    expire_in: 1 day

# ─────────────────────────────────────────────────────────────
# Stage 2: SonarCloud Static Analysis
# ─────────────────────────────────────────────────────────────
sonarqube-scan:
  stage: sonarqube-scan
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  
  # ต้องรอ test เสร็จก่อนเพื่อรับ coverage.xml
  dependencies:
    - phpunit-tests

  variables:
    # ป้องกัน shallow clone ที่ทำให้ SonarQube วิเคราะห์ blame ไม่ได้
    GIT_DEPTH: 0
    # SONAR_TOKEN และ SONAR_HOST_URL ต้องตั้งใน GitLab > Settings > CI/CD > Variables
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache

  script:
    - sonar-scanner
        -Dsonar.host.url=https://sonarcloud.io
        -Dsonar.token="${SONAR_TOKEN}"
        -Dsonar.projectKey="${CI_PROJECT_NAME}"
        -Dsonar.qualitygate.wait=true
  
  # รันเฉพาะบน branch หลัก และ MR
  only:
    - main
    - merge_requests