# Local SonarQube (Community) + scanner.
#
#   docker compose --profile core up -d          # start SonarQube on http://localhost:9000
#   composer test-coverage                       # PHPUnit + coverage.xml with project-relative paths
#   docker compose --profile scanner run --rm sonar-scanner
#
# Put your project token in .env as LOCAL_SONAR_TOKEN (see .env.example).
# Analysis settings (sources, exclusions, coverage report) live in sonar-project.properties.

services:
  sonarqubedb:
    image: postgres:16
    container_name: sonarqubedb
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
      POSTGRES_DB: sonarqube
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sonarqube -d sonarqube" ]
      interval: 10s
      timeout: 5s
      retries: 20
    profiles: [ "core" ]

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      sonarqubedb:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqubedb:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    profiles: [ "core" ]

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: sonar-scanner
    working_dir: /usr/src
    volumes:
      # The project is mounted so the scanner sees the code and coverage.xml
      - ./:/usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
    command:
      - sonar-scanner
      - -Dsonar.projectKey=development-of-a-web-application
      - -Dsonar.projectName=3D Models Web Application
      - -Dsonar.token=${LOCAL_SONAR_TOKEN:-}
    depends_on:
      - sonarqube
    profiles: [ "scanner" ]

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
