# ─── Project identity ───────────────────────────────────────────────────────
# sonar.organization is only read by SonarCloud; a local SonarQube server ignores it.
sonar.organization=cre4mil
sonar.projectKey=cre4mil_development-of-a-web-application-for-3d-models-storing-and-displaying
sonar.projectName=development-of-a-web-application-for-3d-models-storing-and-displaying
sonar.projectVersion=1.0

# ─── Sources and tests ──────────────────────────────────────────────────────
sonar.sources=backend,frontend
sonar.tests=tests
sonar.test.inclusions=tests/**/*Test.php
sonar.sourceEncoding=UTF-8

# Generated / vendored / user content is never analysed.
sonar.exclusions=**/uploads/**,**/*.css,**/*.svg,**/*.py

# ─── Coverage (PHPUnit clover, paths rewritten relative to the project root) ─
sonar.php.coverage.reportPaths=coverage.xml
# Browser scripts (frontend/assets/js) run in the browser and are not part of the PHPUnit suite.
sonar.coverage.exclusions=frontend/assets/**

# ─── Quality gate ───────────────────────────────────────────────────────────
sonar.qualitygate.wait=true
