# ─── Project Identity ────────────────────────────────────────────────────────
# IMPORTANT: sonar.organization ต้องตรงกับ Organization key ใน SonarCloud
sonar.organization=528bdb509db5eb91d8fc5b71a529e0fb88603127
sonar.projectKey=development-of-a-web-application-for-3d-models-storing-and-displaying
sonar.projectName=3D Models Web Application
sonar.projectVersion=1.0

# ─── Source & Language ───────────────────────────────────────────────────────
sonar.sources=.
sonar.language=php
sonar.sourceEncoding=UTF-8

# ─── Exclusions ──────────────────────────────────────────────────────────────
# ยกเว้นไฟล์ที่ไม่ต้องวิเคราะห์
sonar.exclusions=vendor/**,uploads/**,coverage-html/**,*.py,*.css,composer.phar

# ─── Tests ───────────────────────────────────────────────────────────────────
sonar.tests=tests
sonar.test.inclusions=tests/**/*Test.php

# ─── Coverage Report (จาก PHPUnit --coverage-clover) ────────────────────────
sonar.php.coverage.reportPaths=coverage.xml

# ─── Quality Gate ────────────────────────────────────────────────────────────
sonar.qualitygate.wait=true