# ─── Project Identity ────────────────────────────────────────────────────────
# IMPORTANT: sonar.organization ต้องตรงกับ Organization key ใน SonarCloud
sonar.organization=cre4mil
sonar.projectKey=cre4mil_development-of-a-web-application-for-3d-models-storing-and-displaying
sonar.projectName=development-of-a-web-application-for-3d-models-storing-and-displaying
sonar.projectVersion=1.0

# ─── Source & Language ───────────────────────────────────────────────────────
sonar.sources=.
sonar.language=php
sonar.sourceEncoding=UTF-8

# ─── Exclusions ──────────────────────────────────────────────────────────────
# ยกเว้นไฟล์ที่ไม่ต้องวิเคราะห์
sonar.exclusions=vendor/**,**/uploads/**,coverage-html/**,**/*.py,**/*.css,composer.phar

# ─── Tests ───────────────────────────────────────────────────────────────────
sonar.tests=tests
sonar.test.inclusions=tests/**/*Test.php

# ─── Coverage Report (จาก PHPUnit --coverage-clover) ────────────────────────
sonar.php.coverage.reportPaths=coverage.xml
# Procedural HTTP entry points require database-backed integration tests; coverage is
# measured on the testable services they delegate to until that harness is added.
sonar.coverage.exclusions=frontend/uploads.php,backend/api/login.php,backend/api/register.php

# ─── Quality Gate ────────────────────────────────────────────────────────────
sonar.qualitygate.wait=true
